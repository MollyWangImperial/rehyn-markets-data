services:
  # The data pipeline: the request watcher, news sentiment every 15 minutes and the daily collector at 06:30 London.
  # Standard (1 CPU, 2 GB). The watcher keeps the sentiment model loaded and a 15 minute run loads a second copy for a
  # few minutes; measured memory was about 0.5 GB idle and 1.5 GB at its peak (22 November 2026), so 2 GB has room.
  # Move up to Pro (2 CPU, 4 GB) only if Render shows memory near the limit. The disk holds the database, the headline
  # index and the model.
  - type: worker
    name: rehyn-markets-pipeline
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: singapore
    autoDeploy: true
    disk:
      name: pipeline-data
      mountPath: /app/data
      sizeGB: 20
    envVars:
      - key: REHYN_TORCH_THREADS
        value: "2"
      # Written to data/collector.env at start. SENTIMENT_DB_TOKEN must be able to write to the sentiment database.
      - key: REHYN_SEC_CONTACT
        sync: false
      - key: SENTIMENT_DB_URL
        sync: false
      - key: SENTIMENT_DB_TOKEN
        sync: false
      # The Turso organisation that holds rehyn-markets-public: the model copy and the daily public edition sync.
      - key: TURSO_ORG
        sync: false
      - key: TURSO_API_TOKEN
        sync: false
      # The same value as JOBS_TOKEN on rehyn-markets-ai: each job reports to its watchdog after every run.
      - key: JOBS_TOKEN
        sync: false
      # Free key for the Census trade API (census_trade); without it that one source is skipped.
      - key: CENSUS_API_KEY
        sync: false
